name: Apple TV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/tv/**'
      - 'apps/mobile/assets/pulpo-smiley.png'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tvos.yml'

permissions:
  contents: read

concurrency:
  group: tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Install tvOS simulator runtime
        run: xcodebuild -downloadPlatform tvOS
      - name: Run native and remote tests
        run: npm run tv:test
      - name: Build Release
        run: npm run tv:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tvos-simulator-results
          path: apps/tv/.build/evidence/*.xcresult
          retention-days: 7
