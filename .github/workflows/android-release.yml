name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version (for example, 1.2.3)
        required: true
        type: string
      upload:
        description: Upload to Google Play internal testing
        default: false
        type: boolean
      publish_github:
        description: Attach APK to the existing GitHub release (must build its exact tag commit)
        default: false
        type: boolean
      release_status:
        description: Use draft until the first Play release is set up
        default: draft
        type: choice
        options: [draft, completed]
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      upload:
        default: false
        type: boolean
      publish_github:
        default: false
        type: boolean
      release_status:
        default: completed
        type: string

permissions:
  contents: read

concurrency:
  group: android-google-play
  cancel-in-progress: false

jobs:
  android:
    name: Build signed Android bundle and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: google-play
    outputs:
      version_code: ${{ steps.version.outputs.code }}
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_DEFAULT_INSTANCE_URL: https://pulpo.baby
      PULPO_ANDROID_PASSKEY_DOMAINS: ${{ vars.PULPO_ANDROID_PASSKEY_DOMAINS }}
    steps:
      - name: Check out release tag
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}

      - name: Check out selected ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release inputs and set Android version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          UPLOAD_RELEASE: ${{ inputs.upload }}
          PUBLISH_GITHUB: ${{ inputs.publish_github }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must use major.minor.patch.' >&2
            exit 1
          fi
          if [[ "${RELEASE_STATUS}" != draft && "${RELEASE_STATUS}" != completed ]]; then
            echo 'Release status must be draft or completed.' >&2
            exit 1
          fi
          if [[ "${UPLOAD_RELEASE}" == true &&
                "${GITHUB_REF}" != refs/heads/main &&
                "${GITHUB_REF}" != "refs/tags/v${RELEASE_VERSION}" ]]; then
            echo 'Google Play uploads require main or a release tag matching the app version (v<version>).' >&2
            echo 'Leave upload unchecked to build downloadable artifacts from another branch.' >&2
            exit 1
          fi
          if [[ "${PUBLISH_GITHUB}" == true ]]; then
            git fetch --no-tags origin "refs/tags/v${RELEASE_VERSION}"
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse 'FETCH_HEAD^{commit}')" ]]; then
              echo 'GitHub publishing requires the exact commit tagged v<version>.' >&2
              exit 1
            fi
          fi
          # Seconds since 2024 keep codes increasing on retries and well below
          # Google Play's 2,100,000,000 limit. All Android runs share one lock.
          version_code="$(( $(date -u +%s) - 1704067200 ))"
          if (( version_code <= 0 || version_code > 2100000000 )); then
            echo 'Android version code is outside the Google Play range.' >&2
            exit 1
          fi
          {
            echo "PULPO_APP_VERSION=${RELEASE_VERSION}"
            echo "PULPO_ANDROID_VERSION_CODE=${version_code}"
          } >> "${GITHUB_ENV}"
          echo "code=${version_code}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - name: Install dependencies
        run: npm clean-install

      - name: Build mobile workspace dependencies
        run: |
          npm run build -w @pulpo/contracts
          npm run build -w @pulpo/client-core

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      # As with TestFlight, signing credentials are only exposed after npm and
      # Expo lifecycle scripts finish. The temporary keystore is never cached.
      - name: Build and verify signed app bundle and APK
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: bash apps/mobile/scripts/build-android-release.sh

      - name: Save Android app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pulpo-${{ inputs.version }}-Android-${{ env.PULPO_ANDROID_VERSION_CODE }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK release asset
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir android-release
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "android-release/Pulpo-${RELEASE_VERSION}-Android.apk"
          cd android-release
          sha256sum "Pulpo-${RELEASE_VERSION}-Android.apk" > "Pulpo-${RELEASE_VERSION}-Android.apk.sha256"

      - name: Save Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk-${{ inputs.version }}-${{ env.PULPO_ANDROID_VERSION_CODE }}
          path: android-release/*
          if-no-files-found: error
          retention-days: 30

  github-publish:
    name: Publish Android APK to GitHub Release
    if: inputs.publish_github
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk-${{ inputs.version }}-${{ needs.android.outputs.version_code }}
          path: android-release

      - name: Attach APK and checksum to GitHub Release
        working-directory: android-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha256sum --check "Pulpo-${RELEASE_VERSION}-Android.apk.sha256"
          gh release upload "v${RELEASE_VERSION}" \
            "Pulpo-${RELEASE_VERSION}-Android.apk" \
            "Pulpo-${RELEASE_VERSION}-Android.apk.sha256" \
            --clobber --repo "${GITHUB_REPOSITORY}"

  play-upload:
    name: Upload Android bundle to Google Play
    if: inputs.upload
    needs: android
    runs-on: ubuntu-24.04
    environment: google-play
    steps:
      - name: Download signed app bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Pulpo-${{ inputs.version }}-Android-${{ needs.android.outputs.version_code }}
          path: android-bundle

      - name: Validate Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]]; then
            echo 'Configure GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in the google-play environment.' >&2
            exit 1
          fi

      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.isaacthoman.pulpo
          releaseFiles: android-bundle/app-release.aab
          releaseName: ${{ inputs.version }} (${{ needs.android.outputs.version_code }})
          tracks: internal
          status: ${{ inputs.release_status }}
