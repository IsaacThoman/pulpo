# Local-only host bindings. Docker Compose merges this file automatically when
# running `docker compose` without explicit `-f` arguments. Coolify reads only
# compose.yaml, so deployment services remain internal to its Docker network.
services:
  web:
    ports:
      - "${PULPO_HTTP_PORT:-8080}:80"

  api:
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  seaweed-s3:
    ports:
      - "${S3_BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-8333}:8333"
