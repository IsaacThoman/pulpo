# Production API paths are routed directly to the API by Traefik. This
# frontend has no fixed API container address to go stale during replacement.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /ready {
    access_log off;
    try_files /index.html =503;
  }

  location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
