name: Build and optionally deploy workspace controller

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/workspace-controller/**
      - infra/workspace-controller/Dockerfile
      - .github/workflows/workspace-controller.yml

permissions:
  contents: read

concurrency:
  group: workspace-controller
  cancel-in-progress: true

jobs:
  build:
    name: Build controller image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/workspace-controller/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pulpo-workspace-controller:deploy
          provenance: false
          sbom: false
          cache-from: type=gha,scope=workspace-controller
          cache-to: type=gha,mode=max,scope=workspace-controller

      - name: Export image tarball
        run: |
          set -euo pipefail
          id="$(docker image inspect pulpo-workspace-controller:deploy --format '{{.Id}}')"
          echo "${id}" > controller-image-id.txt
          docker save pulpo-workspace-controller:deploy | gzip > controller.tar.gz
          ls -lh controller.tar.gz

      - name: Upload deploy artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-controller-image
          path: |
            controller.tar.gz
            controller-image-id.txt
          retention-days: 3

  deploy:
    name: Deploy controller
    needs: build
    if: ${{ vars.WORKSPACE_CONTROLLER_RUNNER != '' }}
    runs-on: ${{ vars.WORKSPACE_CONTROLLER_RUNNER }}
    env:
      CONTAINERD_COMMAND: ${{ vars.WORKSPACE_CONTROLLER_CONTAINERD_COMMAND || 'ctr' }}
      CONTAINER_NAME: ${{ vars.WORKSPACE_CONTROLLER_CONTAINER_NAME || 'controller' }}
      DEPLOYMENT_NAME: ${{ vars.WORKSPACE_CONTROLLER_DEPLOYMENT || 'pulpo-workspace-controller' }}
      IMAGE_REPOSITORY: ${{ vars.WORKSPACE_CONTROLLER_IMAGE_REPOSITORY || 'docker.io/library/pulpo-workspace-controller' }}
      KUBECTL_COMMAND: ${{ vars.WORKSPACE_CONTROLLER_KUBECTL_COMMAND || 'kubectl' }}
      NAMESPACE: ${{ vars.WORKSPACE_CONTROLLER_NAMESPACE || 'pulpo-workspaces' }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workspace-controller-image
          path: deploy

      - name: Import image and roll out
        shell: bash
        run: |
          set -euo pipefail
          read -r -a containerd <<< "${CONTAINERD_COMMAND}"
          read -r -a kubectl <<< "${KUBECTL_COMMAND}"
          IMAGE_ID="$(tr -d '[:space:]' < deploy/controller-image-id.txt)"
          IMAGE_REF="${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"
          SOURCE_REF="docker.io/library/pulpo-workspace-controller:deploy"

          "${containerd[@]}" images import deploy/controller.tar.gz
          "${containerd[@]}" images tag "${SOURCE_REF}" "${IMAGE_REF}"
          "${containerd[@]}" images tag "${SOURCE_REF}" "${IMAGE_REPOSITORY}:main"
          "${kubectl[@]}" -n "${NAMESPACE}" set image \
            "deployment/${DEPLOYMENT_NAME}" \
            "${CONTAINER_NAME}=${IMAGE_REF}"
          "${kubectl[@]}" -n "${NAMESPACE}" rollout status \
            "deployment/${DEPLOYMENT_NAME}" \
            --timeout=180s
          echo "Deployed ${IMAGE_REF} (${IMAGE_ID})"
