name: pulpo

x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  env_file: ${PULPO_ENV_FILE:-.env.example}
  depends_on:
    object-storage-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  # Coolify writes the selected production or preview configuration to this
  # runtime env file. Do not repeat deployment-owned keys under `environment`:
  # explicit Compose values override env_file values, including with an empty
  # string, which would discard preview-only secrets and bootstrap settings.
  environment:
    POSTGRES_HOST: ${SERVICE_NAME_POSTGRES:-postgres}
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${SERVICE_USER_POSTGRES}
    POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    POSTGRES_DATABASE: pulpo
    REDIS_URL: redis://${SERVICE_NAME_REDIS:-redis}:6379
    PULPO_OLLAMA_URL: ${PULPO_OLLAMA_URL:-http://ollama:11434}
    STORAGE_LOCAL_PATH: /app/data/objects
    S3_ENDPOINT: http://${SERVICE_NAME_SEAWEED_S3:-seaweed-s3}:8333
    S3_ACCESS_KEY_ID: ${SERVICE_USER_S3}
    S3_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_S3}
  volumes:
    - object_data:/app/data/objects

services:
  object-storage-init:
    image: alpine:3.22
    # Existing volumes may contain directories created by an older root-running
    # container, so repair the entire tree before the node user starts writing.
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - object_data:/data
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    environment:
      API_HOST: ${SERVICE_NAME_API:-api}
      NGINX_ENVSUBST_FILTER: ^API_HOST$
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    labels:
      # Do not rely on Coolify's disposable preview-domain metadata for edge
      # routing. SERVICE_NAME_WEB is deployment-scoped (for example,
      # web-pr-319), so these router and middleware names remain unique when
      # several previews share the same Traefik instance.
      - traefik.enable=true
      - "traefik.http.middlewares.${SERVICE_NAME_WEB:-pulpo-web}-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-http.entryPoints=http"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-http.middlewares=${SERVICE_NAME_WEB:-pulpo-web}-redirect"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-http.rule=Host(`${SERVICE_FQDN_WEB:-localhost}`) && PathPrefix(`/`)"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-http.service=${SERVICE_NAME_WEB:-pulpo-web}"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.entryPoints=https"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.rule=Host(`${SERVICE_FQDN_WEB:-localhost}`) && PathPrefix(`/`)"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.service=${SERVICE_NAME_WEB:-pulpo-web}"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.tls=true"
      - "traefik.http.services.${SERVICE_NAME_WEB:-pulpo-web}.loadbalancer.server.port=80"
    restart: unless-stopped

  api:
    <<: *server
    command: ["sh", "-c", "node apps/server/dist/database/migrate.js && npm run start:api -w @pulpo/server"]
    expose:
      - "3000"

  worker:
    <<: *server
    command: ["npm", "run", "start:worker", "-w", "@pulpo/server"]

  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    # Coolify generates deployment-scoped credentials that are reused by the
    # API and worker through the shared server environment above.
    environment:
      POSTGRES_DB: pulpo
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pulpo} -d $${POSTGRES_DATABASE:-pulpo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.15
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweed-master:
    image: chrislusf/seaweedfs:4.29
    # Coolify rewrites preview service names after parsing Compose. Resolve its
    # injected runtime service names only after the container starts.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /entrypoint.sh master -ip="$${SERVICE_NAME_SEAWEED_MASTER:-seaweed-master}" -mdir=/data'
    volumes:
      - seaweed_master_data:/data
    restart: unless-stopped

  seaweed-volume:
    image: chrislusf/seaweedfs:4.29
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /entrypoint.sh volume -mserver="$${SERVICE_NAME_SEAWEED_MASTER:-seaweed-master}:9333" -ip="$${SERVICE_NAME_SEAWEED_VOLUME:-seaweed-volume}" -dir=/data -max=0'
    depends_on:
      - seaweed-master
    volumes:
      - seaweed_volume_data:/data
    restart: unless-stopped

  seaweed-filer:
    image: chrislusf/seaweedfs:4.29
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /entrypoint.sh filer -master="$${SERVICE_NAME_SEAWEED_MASTER:-seaweed-master}:9333" -ip="$${SERVICE_NAME_SEAWEED_FILER:-seaweed-filer}"'
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed_filer_data:/data
    restart: unless-stopped

  seaweed-s3:
    image: chrislusf/seaweedfs:4.29
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /entrypoint.sh s3 -filer="$${SERVICE_NAME_SEAWEED_FILER:-seaweed-filer}:8888" -ip.bind=0.0.0.0'
    environment:
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_S3}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_S3}
      SERVICE_URL_S3_8333:
    expose:
      - "8333"
    depends_on:
      - seaweed-filer
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
  object_data:
  ollama_models:
