# systemd-networkd deletes routing policy rules it did not create whenever it
# restarts or reconfigures (e.g. a systemd package upgrade via unattended-upgrades).
# That silently removes the 7420/7421 rules installed by pulpo-workspace-egress,
# and the kill switch then drops all workspace egress.
[Network]
ManageForeignRoutingPolicyRules=no
