# Managed separately from application releases. Never run down --volumes.
# Existing external volume names are mandatory; this file never creates replacements.
name: pulpo-production-infrastructure
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: pulpo
      POSTGRES_USER: ${POSTGRES_USER:?Reuse the existing database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Reuse the existing database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-pulpo} -d $${POSTGRES_DATABASE:-pulpo}
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - pulpo-prod-postgres
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - yes
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - pulpo-prod-redis
  ollama:
    image: ollama/ollama:0.32.15
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - pulpo-prod-ollama
  seaweed-master:
    image: chrislusf/seaweedfs:4.29
    command:
      - master
      - -ip=pulpo-prod-seaweed-master
      - -mdir=/data
    volumes:
      - seaweed_master_data:/data
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - pulpo-prod-seaweed-master
  seaweed-volume:
    image: chrislusf/seaweedfs:4.29
    command:
      - volume
      - -mserver=pulpo-prod-seaweed-master:9333
      - -ip=pulpo-prod-seaweed-volume
      - -dir=/data
      - -max=0
    depends_on:
      - seaweed-master
    volumes:
      - seaweed_volume_data:/data
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - pulpo-prod-seaweed-volume
  seaweed-filer:
    image: chrislusf/seaweedfs:4.29
    command:
      - filer
      - -master=pulpo-prod-seaweed-master:9333
      - -ip=pulpo-prod-seaweed-filer
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed_filer_data:/data
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - pulpo-prod-seaweed-filer
  seaweed-s3:
    image: chrislusf/seaweedfs:4.29
    command:
      - s3
      - -filer=pulpo-prod-seaweed-filer:8888
      - -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Reuse the existing S3 key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Reuse the existing S3 secret}
    expose:
      - "8333"
    depends_on:
      - seaweed-filer
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - pulpo-prod-seaweed-s3
volumes:
  postgres_data:
    external: true
    name: ${PULPO_DATA_PREFIX:?Existing Coolify resource UUID}_postgres-data
  redis_data:
    external: true
    name: ${PULPO_DATA_PREFIX:?Existing Coolify resource UUID}_redis-data
  ollama_models:
    external: true
    name: ${PULPO_DATA_PREFIX:?Existing Coolify resource UUID}_ollama-models
  seaweed_master_data:
    external: true
    name: ${PULPO_DATA_PREFIX:?Existing Coolify resource UUID}_seaweed-master-data
  seaweed_volume_data:
    external: true
    name: ${PULPO_DATA_PREFIX:?Existing Coolify resource UUID}_seaweed-volume-data
  seaweed_filer_data:
    external: true
    name: ${PULPO_DATA_PREFIX:?Existing Coolify resource UUID}_seaweed-filer-data
networks:
  coolify:
    external: true
    name: coolify
