name: Build, publish, and optionally deploy workspace controller

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/workspace-controller/**
      - infra/workspace-controller/**
      - .github/scripts/deploy-workspace-controller*
      - .github/workflows/workspace-controller.yml
  push:
    branches: [main]
    paths:
      - packages/workspace-controller/**
      - infra/workspace-controller/**
      - .github/scripts/deploy-workspace-controller*
      - .github/workflows/workspace-controller.yml

permissions:
  contents: read

concurrency:
  group: workspace-controller-${{ github.ref }}
  # A PR must never cancel a production rollout; finish an in-flight deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test controller deployment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test pull checks and deployment failure handling
        run: python3 .github/scripts/deploy-workspace-controller_test.py -v

  build:
    name: Build controller image
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image repository
        id: repository
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${REPOSITORY_OWNER,,}/pulpo-workspace-controller" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (publish only from main)
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/workspace-controller/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.repository.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=workspace-controller
          cache-to: type=gha,mode=max,scope=workspace-controller

      - name: Record immutable image reference
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: reference
        env:
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Published controller: \`${IMAGE_REPOSITORY}@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Verify registry access and deploy controller
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.WORKSPACE_CONTROLLER_RUNNER != ''
    runs-on: ${{ vars.WORKSPACE_CONTROLLER_RUNNER }}
    timeout-minutes: 15
    env:
      CONTAINER_NAME: ${{ vars.WORKSPACE_CONTROLLER_CONTAINER_NAME || 'controller' }}
      DEPLOYMENT_NAME: ${{ vars.WORKSPACE_CONTROLLER_DEPLOYMENT || 'pulpo-workspace-controller' }}
      KUBECTL_COMMAND: ${{ vars.WORKSPACE_CONTROLLER_KUBECTL_COMMAND || 'kubectl' }}
      NAMESPACE: ${{ vars.WORKSPACE_CONTROLLER_NAMESPACE || 'pulpo-workspaces' }}
      IMAGE_REF: ${{ needs.build.outputs.image }}
    steps:
      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Kubernetes can pull the image before replacing the controller
        run: python3 .github/scripts/deploy-workspace-controller.py
