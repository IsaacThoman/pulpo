name: pulpo

x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  env_file: ${PULPO_ENV_FILE:-.env.example}
  depends_on:
    object-storage-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  environment:
    POSTGRES_HOST: ${SERVICE_NAME_POSTGRES:-postgres}
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-pulpo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulpo}
    POSTGRES_DATABASE: ${POSTGRES_DATABASE:-pulpo}
    REDIS_URL: redis://${SERVICE_NAME_REDIS:-redis}:6379
    STORAGE_LOCAL_PATH: /app/data/objects
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pulpo}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-replace-this-storage-secret}
    S3_ENDPOINT: http://${SERVICE_NAME_SEAWEED_S3:-seaweed-s3}:8333
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:-development-only-key-change-me-000000}
    WORKSPACE_CONTROLLER_URL: ${WORKSPACE_CONTROLLER_URL:-}
    WORKSPACE_CONTROLLER_TOKEN: ${WORKSPACE_CONTROLLER_TOKEN:-}
    WORKSPACE_CONTROLLER_CA_CERT_BASE64: ${WORKSPACE_CONTROLLER_CA_CERT_BASE64:-}
    PULPO_INSTANCE_ID: ${PULPO_INSTANCE_ID:-}
    # Coolify generates this URL per production/preview deployment. Explicit
    # S3_PUBLIC_ENDPOINT values still take precedence.
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${SERVICE_URL_S3_8333:-http://localhost:8333}}
    # Optional one-time bootstrap for trusted CI previews. Keep these unset in
    # production and provide secret values as runtime-only Coolify variables.
    PULPO_BOOTSTRAP_PRESET: ${PULPO_BOOTSTRAP_PRESET:-}
    PULPO_PREVIEW_ADMIN_EMAIL: ${PULPO_PREVIEW_ADMIN_EMAIL:-}
    PULPO_PREVIEW_ADMIN_PASSWORD: ${PULPO_PREVIEW_ADMIN_PASSWORD:-}
    PULPO_PREVIEW_PROVIDER_API_KEY: ${PULPO_PREVIEW_PROVIDER_API_KEY:-}
    PULPO_PREVIEW_WORKSPACE_IMAGE_DIGEST: ${PULPO_PREVIEW_WORKSPACE_IMAGE_DIGEST:-}
  volumes:
    - object_data:/app/data/objects

services:
  object-storage-init:
    image: alpine:3.22
    # Existing volumes may contain directories created by an older root-running
    # container, so repair the entire tree before the node user starts writing.
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - object_data:/data
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    environment:
      API_HOST: ${SERVICE_NAME_API:-api}
      NGINX_ENVSUBST_FILTER: ^API_HOST$
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    labels:
      # Coolify preview domains are stored as FQDNs. Its generated preview
      # router is HTTP-only, so add a uniquely named TLS router for Cloudflare
      # and other HTTPS origins. SERVICE_NAME_WEB includes the PR suffix.
      - traefik.enable=true
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.entryPoints=https"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.rule=Host(`${SERVICE_FQDN_WEB:-localhost}`) && PathPrefix(`/`)"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.service=${SERVICE_NAME_WEB:-pulpo-web}-https"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${SERVICE_NAME_WEB:-pulpo-web}-https.tls=true"
      - "traefik.http.services.${SERVICE_NAME_WEB:-pulpo-web}-https.loadbalancer.server.port=80"
    restart: unless-stopped

  api:
    <<: *server
    command: ["sh", "-c", "node apps/server/dist/database/migrate.js && npm run start:api -w @pulpo/server"]
    expose:
      - "3000"
    networks:
      default:
        aliases:
          # Coolify suffixes Compose service names for pull request stacks.
          # Keep a stable alias inside the preview's isolated network so the
          # web proxy can use the same API_HOST in production and previews.
          - api

  worker:
    <<: *server
    command: ["npm", "run", "start:worker", "-w", "@pulpo/server"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-pulpo}
      POSTGRES_USER: ${POSTGRES_USER:-pulpo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulpo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulpo} -d ${POSTGRES_DATABASE:-pulpo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - postgres
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - redis
    restart: unless-stopped

  seaweed-master:
    image: chrislusf/seaweedfs:4.29
    command: ["master", "-ip=${SERVICE_NAME_SEAWEED_MASTER:-seaweed-master}", "-mdir=/data"]
    volumes:
      - seaweed_master_data:/data
    networks:
      default:
        aliases:
          - seaweed-master
    restart: unless-stopped

  seaweed-volume:
    image: chrislusf/seaweedfs:4.29
    command: ["volume", "-mserver=${SERVICE_NAME_SEAWEED_MASTER:-seaweed-master}:9333", "-ip=${SERVICE_NAME_SEAWEED_VOLUME:-seaweed-volume}", "-dir=/data", "-max=0"]
    depends_on:
      - seaweed-master
    volumes:
      - seaweed_volume_data:/data
    networks:
      default:
        aliases:
          - seaweed-volume
    restart: unless-stopped

  seaweed-filer:
    image: chrislusf/seaweedfs:4.29
    command: ["filer", "-master=${SERVICE_NAME_SEAWEED_MASTER:-seaweed-master}:9333", "-ip=${SERVICE_NAME_SEAWEED_FILER:-seaweed-filer}"]
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed_filer_data:/data
    networks:
      default:
        aliases:
          - seaweed-filer
    restart: unless-stopped

  seaweed-s3:
    image: chrislusf/seaweedfs:4.29
    command: ["s3", "-filer=${SERVICE_NAME_SEAWEED_FILER:-seaweed-filer}:8888", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pulpo}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-replace-this-storage-secret}
      SERVICE_URL_S3_8333:
    expose:
      - "8333"
    depends_on:
      - seaweed-filer
    networks:
      default:
        aliases:
          - seaweed-s3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
  object_data:
