plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pulpodoceditor'
version = '1.0.0'

android {
  namespace "expo.modules.pulpodoceditor"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.webkit:webkit:1.14.0"
}
