name: pulpo

x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  env_file: ${PULPO_ENV_FILE:-.env.example}
  depends_on:
    object-storage-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  # Coolify writes the selected production or preview configuration to this
  # runtime env file. Do not repeat deployment-owned keys under `environment`:
  # explicit Compose values override env_file values, including with an empty
  # string, which would discard preview-only secrets and bootstrap settings.
  environment:
    POSTGRES_HOST: ${SERVICE_NAME_POSTGRES:-postgres}
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${SERVICE_USER_POSTGRES:-pulpo}
    POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-pulpo}
    POSTGRES_DATABASE: pulpo
    REDIS_URL: redis://${SERVICE_NAME_REDIS:-redis}:6379
    STORAGE_LOCAL_PATH: /app/data/objects
    S3_ENDPOINT: http://${SERVICE_NAME_SEAWEED_S3:-seaweed-s3}:8333
    S3_ACCESS_KEY_ID: ${SERVICE_USER_S3:-pulpo}
    S3_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_S3:-pulpo-development-storage-secret}
  volumes:
    - object_data:/app/data/objects

services:
  object-storage-init:
    image: alpine:3.22
    # Existing volumes may contain directories created by an older root-running
    # container, so repair the entire tree before the node user starts writing.
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - object_data:/data
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_HOST: ${SERVICE_NAME_API:-api}
      CLIENT_MAX_BODY_SIZE: ${PULPO_CLIENT_MAX_BODY_SIZE:-25m}
      NGINX_ENVSUBST_FILTER: ^(API_HOST|CLIENT_MAX_BODY_SIZE)$
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *server
    command: ["node", "apps/server/dist/database/migrate.js"]
    restart: "no"

  api:
    <<: *server
    command: ["npm", "run", "start:api", "-w", "@pulpo/server"]
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    <<: *server
    command: ["npm", "run", "start:worker", "-w", "@pulpo/server"]
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    # Coolify generates deployment-scoped credentials that are reused by the
    # API and worker through the shared server environment above.
    environment:
      POSTGRES_DB: pulpo
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-pulpo}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-pulpo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pulpo} -d $${POSTGRES_DATABASE:-pulpo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweed-master:
    image: chrislusf/seaweedfs:4.29
    # Coolify rewrites preview service names after parsing Compose. Resolve its
    # injected runtime service names only after the container starts.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /entrypoint.sh master -ip="$${SERVICE_NAME_SEAWEED_MASTER:-seaweed-master}" -mdir=/data'
    volumes:
      - seaweed_master_data:/data
    restart: unless-stopped

  seaweed-volume:
    image: chrislusf/seaweedfs:4.29
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /entrypoint.sh volume -mserver="$${SERVICE_NAME_SEAWEED_MASTER:-seaweed-master}:9333" -ip="$${SERVICE_NAME_SEAWEED_VOLUME:-seaweed-volume}" -dir=/data -max=0'
    depends_on:
      - seaweed-master
    volumes:
      - seaweed_volume_data:/data
    restart: unless-stopped

  seaweed-filer:
    image: chrislusf/seaweedfs:4.29
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /entrypoint.sh filer -master="$${SERVICE_NAME_SEAWEED_MASTER:-seaweed-master}:9333" -ip="$${SERVICE_NAME_SEAWEED_FILER:-seaweed-filer}"'
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed_filer_data:/data
    restart: unless-stopped

  seaweed-s3:
    image: chrislusf/seaweedfs:4.29
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /entrypoint.sh s3 -filer="$${SERVICE_NAME_SEAWEED_FILER:-seaweed-filer}:8888" -ip.bind=0.0.0.0'
    environment:
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_S3:-pulpo}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_S3:-pulpo-development-storage-secret}
      SERVICE_URL_S3_8333:
    expose:
      - "8333"
    depends_on:
      - seaweed-filer
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
  object_data:
