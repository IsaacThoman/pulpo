name: pulpo

x-server: &server
  build:
    context: .
    dockerfile: server/Dockerfile
  env_file: ${PULPO_ENV_FILE:-.env.example}
  depends_on:
    object-storage-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-pulpo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulpo}
    POSTGRES_DATABASE: ${POSTGRES_DATABASE:-pulpo}
    REDIS_URL: redis://redis:6379
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pulpo}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-replace-this-storage-secret}
  volumes:
    - object_data:/app/data/objects

services:
  object-storage-init:
    image: alpine:3.22
    # Existing volumes may contain directories created by an older root-running
    # container, so repair the entire tree before the node user starts writing.
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - object_data:/data
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    expose:
      - "80"
    restart: unless-stopped

  api:
    <<: *server
    command: ["sh", "-c", "node server/dist/database/migrate.js && npm run start:api -w @pulpo/server"]
    expose:
      - "3000"

  worker:
    <<: *server
    command: ["npm", "run", "start:worker", "-w", "@pulpo/server"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-pulpo}
      POSTGRES_USER: ${POSTGRES_USER:-pulpo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulpo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulpo} -d ${POSTGRES_DATABASE:-pulpo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweed-master:
    image: chrislusf/seaweedfs:4.29
    command: ["master", "-ip=seaweed-master", "-mdir=/data"]
    volumes:
      - seaweed_master_data:/data
    restart: unless-stopped

  seaweed-volume:
    image: chrislusf/seaweedfs:4.29
    command: ["volume", "-mserver=seaweed-master:9333", "-ip=seaweed-volume", "-dir=/data", "-max=0"]
    depends_on:
      - seaweed-master
    volumes:
      - seaweed_volume_data:/data
    restart: unless-stopped

  seaweed-filer:
    image: chrislusf/seaweedfs:4.29
    command: ["filer", "-master=seaweed-master:9333", "-ip=seaweed-filer"]
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed_filer_data:/data
    restart: unless-stopped

  seaweed-s3:
    image: chrislusf/seaweedfs:4.29
    command: ["s3", "-filer=seaweed-filer:8888", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pulpo}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-replace-this-storage-secret}
    expose:
      - "8333"
    depends_on:
      - seaweed-filer
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
  object_data:
