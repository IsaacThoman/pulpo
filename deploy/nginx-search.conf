# Traefik routes /api/search requests directly to the Pulpo API.
map $request_uri $search_cache_control {
  ~^/auth/callback(?:\?|$) "no-store";
  ~^/assets/              "public, max-age=31536000, immutable";
  default                 "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cache-Control $search_cache_control;

  location = /ready {
    access_log off;
    root /tmp;
    try_files /pulpo-web-ready =503;
  }

  location ~ ^/(api|v1)(/|$) {
    return 503;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /auth/callback {
    access_log off;
    try_files /index.html =503;
  }
}
