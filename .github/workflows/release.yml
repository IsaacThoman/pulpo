name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize main releases without cancelling the run that currently owns the
  # lock. A queued run refreshes main again in the release job below.
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: Dependency audit
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Report high and critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  checks:
    name: Checks / ${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test
            command: npm test
          - name: Build
            command: npm run build
          - name: Lint
            command: npm run lint
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Validate Compose runtime environment precedence
        if: matrix.name == 'Build'
        run: bash .github/scripts/validate-compose-runtime-env.sh

      - name: Validate Coolify deployment boundaries
        if: matrix.name == 'Build'
        run: bash .github/scripts/validate-coolify-deployment-boundaries.sh

      - name: Validate production deployment ordering
        run: python3 .github/scripts/deploy-production_test.py

  cli-package:
    name: CLI package / Node ${{ matrix.node }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.0, 24.18.1]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Build and smoke-test packed CLI
        run: |
          set -euo pipefail
          npm run build -w @pulpo/contracts
          npm run build -w @pulpo/client-core
          npm run build -w @isaacthoman/pulpo
          tarball="$(npm pack ./apps/cli --pack-destination "${RUNNER_TEMP}" --silent)"
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/pulpo-cli-smoke.XXXXXX")"
          trap 'rm -rf "${smoke_dir}"' EXIT
          npm install --prefix "${smoke_dir}" "${RUNNER_TEMP}/${tarball}"
          "${smoke_dir}/node_modules/.bin/pulpo" --version
          "${smoke_dir}/node_modules/.bin/pulpo" --json settings schema >/dev/null

  desktop-windows-check:
    name: Desktop / Windows / ${{ matrix.arch }} package check
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Build unsigned Squirrel.Windows artifacts
        run: npm run make -w @pulpo/desktop -- --platform=win32 --arch=${{ matrix.arch }}

      - name: Validate Squirrel.Windows artifacts
        shell: pwsh
        run: |
          $makeDirectory = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/out/make/squirrel.windows/${{ matrix.arch }}'
          $appPath = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/out/Pulpo-win32-${{ matrix.arch }}/Pulpo.exe'
          $artifacts = @(Get-ChildItem -Path $makeDirectory -File)
          $setupFiles = @(Get-ChildItem -Path $makeDirectory -File -Filter '*Setup.exe')
          $packages = @(Get-ChildItem -Path $makeDirectory -File -Filter '*-full.nupkg')
          $manifests = @(Get-ChildItem -Path $makeDirectory -File -Filter 'RELEASES')

          if ($artifacts.Count -ne 3 -or $setupFiles.Count -ne 1 -or $setupFiles[0].Name -ne 'Setup.exe' -or $packages.Count -ne 1 -or $manifests.Count -ne 1) {
            throw "Expected one Setup.exe, one full NUPKG, and one RELEASES manifest."
          }

          $manifest = Get-Content -Raw $manifests[0].FullName
          if ($manifest -notmatch [regex]::Escape($packages[0].Name)) {
            throw "The RELEASES manifest does not reference $($packages[0].Name)."
          }

          $stream = [System.IO.File]::OpenRead($appPath)
          $reader = [System.IO.BinaryReader]::new($stream)
          try {
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 4
            $machine = $reader.ReadUInt16()
          } finally {
            $reader.Dispose()
            $stream.Dispose()
          }
          $expectedMachine = if ('${{ matrix.arch }}' -eq 'arm64') { 0xaa64 } else { 0x8664 }
          if ($machine -ne $expectedMachine) {
            throw ('Pulpo.exe has PE machine 0x{0:x4}; expected 0x{1:x4} for ${{ matrix.arch }}.' -f $machine, $expectedMachine)
          }

          $stageDirectory = Join-Path $env:RUNNER_TEMP 'pulpo-windows-${{ matrix.arch }}'
          node apps/desktop/scripts/stage-windows-artifacts.mjs $makeDirectory $stageDirectory '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to stage architecture-specific Windows artifacts.'
          }
          $staged = @(Get-ChildItem -Path $stageDirectory -File)
          $expectedSetup = if ('${{ matrix.arch }}' -eq 'x64') { 'Setup.exe' } else { 'Pulpo-win32-arm64-Setup.exe' }
          $expectedPackagePattern = if ('${{ matrix.arch }}' -eq 'x64') { 'Pulpo-*-full.nupkg' } else { 'Pulpo-win32-arm64-*-full.nupkg' }
          $stagedPackages = @(Get-ChildItem -Path $stageDirectory -File -Filter $expectedPackagePattern)
          $expectedManifest = if ('${{ matrix.arch }}' -eq 'x64') { 'RELEASES' } else { 'RELEASES-win32-arm64' }
          $expectedInstaller = "Pulpo-*-Windows-${{ matrix.arch }}-Setup.exe"
          $stagedInstallers = @(Get-ChildItem -Path $stageDirectory -File -Filter $expectedInstaller)
          if ($staged.Count -ne 4 -or
              !(Test-Path (Join-Path $stageDirectory $expectedSetup)) -or
              !(Test-Path (Join-Path $stageDirectory $expectedManifest)) -or
              $stagedInstallers.Count -ne 1 -or
              $stagedPackages.Count -ne 1) {
            throw 'The staged Windows artifact names are invalid.'
          }

  release:
    name: Semantic release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [checks, cli-package, desktop-windows-check]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm clean-install

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # main can advance while this run waits for the workflow concurrency
          # lock. Refresh once, then let semantic-release calculate and publish
          # the version for that exact main snapshot.
          git pull --ff-only origin main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          npm run release

  desktop-build:
    name: Desktop / ${{ matrix.platform }} / ${{ matrix.arch }}
    if: >-
      needs.release.outputs.version != ''
    needs: release
    runs-on: ${{ matrix.runner }}
    environment:
      name: desktop-release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            arch: arm64
            runner: macos-26
          - platform: macOS
            arch: x64
            runner: macos-26-intel
          - platform: Windows
            arch: x64
            runner: windows-2025
          - platform: Windows
            arch: arm64
            runner: windows-2025
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.release.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Validate release credentials
        if: matrix.platform == 'macOS'
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "The ${variable} desktop-release environment secret is not configured." >&2
              exit 1
            fi
          done

      - name: Import Developer ID identity
        if: matrix.platform == 'macOS'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          auth_key_path="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          certificate_path="${RUNNER_TEMP}/Pulpo-Developer-ID.p12"
          keychain_path="${RUNNER_TEMP}/pulpo-desktop-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "${APP_STORE_CONNECT_API_PRIVATE_KEY}" > "${auth_key_path}"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}"
          chmod 600 "${auth_key_path}" "${certificate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12

          if ! security find-identity -v -p codesigning "${keychain_path}" | grep -q 'Developer ID Application'; then
            echo 'The imported PKCS#12 does not contain a Developer ID Application identity and private key.' >&2
            exit 1
          fi

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

          {
            echo "APPLE_API_KEY_PATH=${auth_key_path}"
            echo "DESKTOP_KEYCHAIN_PATH=${keychain_path}"
            echo "DESKTOP_CERTIFICATE_PATH=${certificate_path}"
          } >> "${GITHUB_ENV}"

      - name: Build signed and notarized desktop artifacts
        if: matrix.platform == 'macOS'
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          PULPO_DESKTOP_RELEASE: 1
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Semantic-release produced an invalid version: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          npm version "${RELEASE_VERSION}" --workspace @pulpo/desktop --no-git-tag-version
          npm run make -w @pulpo/desktop -- --arch=${{ matrix.arch }}

      - name: Verify signed application
        if: matrix.platform == 'macOS'
        run: |
          set -euo pipefail
          app_path="$(find apps/desktop/out -type d -name Pulpo.app -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo 'Forge did not produce Pulpo.app.' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=4 "${app_path}"
          xcrun stapler validate "${app_path}"

      - name: Add platform to DMG artifact name
        if: matrix.platform == 'macOS'
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          dmg_count="$(find apps/desktop/out/make -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "${dmg_count}" != '1' ]]; then
            echo "Expected one DMG artifact, found ${dmg_count}." >&2
            exit 1
          fi
          dmg_path="$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)"
          mv "${dmg_path}" "$(dirname "${dmg_path}")/Pulpo-${RELEASE_VERSION}-macOS-${{ matrix.arch }}.dmg"

      - name: Upload desktop artifacts
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Clean up signing credentials
        if: always() && matrix.platform == 'macOS'
        run: |
          security delete-keychain "${DESKTOP_KEYCHAIN_PATH}" 2>/dev/null || true
          rm -f "${APPLE_API_KEY_PATH}" "${DESKTOP_CERTIFICATE_PATH}"

      - name: Validate Artifact Signing configuration
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
        run: |
          $requiredVariables = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT',
            'AZURE_ARTIFACT_SIGNING_ACCOUNT',
            'AZURE_CERTIFICATE_PROFILE'
          )
          foreach ($name in $requiredVariables) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "The $name desktop-release environment variable is not configured."
            }
          }

      - name: Log in to Azure with GitHub OIDC
        if: matrix.platform == 'Windows'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Artifact Signing client tools
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $installerPath = Join-Path $env:RUNNER_TEMP 'ArtifactSigningClientTools.msi'
          $installerUri = 'https://download.microsoft.com/download/70ad2c3b-761f-4aa9-a9de-e7405aa2b4c1/ArtifactSigningClientTools.msi'
          Invoke-WebRequest -Uri $installerUri -OutFile $installerPath

          $installerSignature = Get-AuthenticodeSignature $installerPath
          if ($installerSignature.Status -ne 'Valid' -or $installerSignature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') {
            throw "Artifact Signing client installer signature is not valid and issued to Microsoft."
          }

          $installer = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', $installerPath, '/quiet', '/norestart')
          if ($installer.ExitCode -ne 0) {
            throw "Artifact Signing client installer exited with code $($installer.ExitCode)."
          }

          $toolDirectory = Join-Path $env:SystemDrive 'pulpo-artifact-signing'
          New-Item -ItemType Directory -Force -Path $toolDirectory | Out-Null

          $dlibCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft/ArtifactSigningClientTools/bin/Azure.CodeSigning.Dlib.dll'),
            (Join-Path $env:LOCALAPPDATA 'Microsoft/MicrosoftArtifactSigningClientTools/Azure.CodeSigning.Dlib.dll')
          )
          $installedDlib = $dlibCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$installedDlib) {
            $installedDlib = Get-ChildItem -Path ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA -Recurse -File -Filter 'Azure.CodeSigning.Dlib.dll' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (!$installedDlib) {
            throw 'The Artifact Signing Dlib was not installed.'
          }

          $installedSignTool = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin') -Recurse -File -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -ExpandProperty FullName -First 1
          if (!$installedSignTool) {
            throw 'A compatible x64 SignTool was not installed.'
          }

          Copy-Item -Path (Join-Path (Split-Path $installedDlib) '*') -Destination $toolDirectory -Recurse -Force
          Copy-Item -Path $installedSignTool -Destination (Join-Path $toolDirectory 'signtool.exe') -Force

          $signToolPath = Join-Path $toolDirectory 'signtool.exe'
          $dlibPath = Join-Path $toolDirectory 'Azure.CodeSigning.Dlib.dll'
          if (!(Test-Path $signToolPath) -or !(Test-Path $dlibPath)) {
            throw 'The installed Artifact Signing client tools are incomplete.'
          }

          $metadataPath = Join-Path $toolDirectory 'metadata.json'
          @{
            Endpoint = $env:AZURE_ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_CERTIFICATE_PROFILE
            CorrelationId = "$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ExcludeCredentials = @(
              'EnvironmentCredential',
              'WorkloadIdentityCredential',
              'ManagedIdentityCredential',
              'SharedTokenCacheCredential',
              'VisualStudioCredential',
              'VisualStudioCodeCredential',
              'AzurePowerShellCredential',
              'AzureDeveloperCliCredential',
              'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 $metadataPath

          @(
            "WINDOWS_SIGNTOOL_PATH=$signToolPath",
            "AZURE_CODE_SIGNING_DLIB=$dlibPath",
            "AZURE_ARTIFACT_SIGNING_METADATA=$metadataPath"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Remove-Item $installerPath -Force

      - name: Build signed Squirrel.Windows artifacts
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          PULPO_DESKTOP_RELEASE: 1
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Semantic-release produced an invalid version: $env:RELEASE_VERSION"
          }
          npm version $env:RELEASE_VERSION --workspace @pulpo/desktop --no-git-tag-version
          npm run make -w @pulpo/desktop -- --platform=win32 --arch=${{ matrix.arch }}

      - name: Verify signed Windows application and installer
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $appPath = Get-ChildItem -Path 'apps/desktop/out/Pulpo-win32-${{ matrix.arch }}' -File -Filter 'Pulpo.exe' | Select-Object -First 1
          $setupFiles = @(Get-ChildItem -Path 'apps/desktop/out/make/squirrel.windows/${{ matrix.arch }}' -File -Filter '*Setup.exe')
          if (!$appPath -or $setupFiles.Count -ne 1) {
            throw 'Forge did not produce the expected Pulpo.exe and Setup.exe files.'
          }

          foreach ($file in @($appPath, $setupFiles[0])) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($file.Name) has an invalid Authenticode signature: $($signature.Status)."
            }
            if ($signature.SignerCertificate.Subject -notlike '*CN=Isaac Thoman*') {
              throw "$($file.Name) was not signed by Isaac Thoman."
            }
            & $env:WINDOWS_SIGNTOOL_PATH verify /pa /all /v $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool rejected $($file.Name)."
            }
          }

          $stream = [System.IO.File]::OpenRead($appPath.FullName)
          $reader = [System.IO.BinaryReader]::new($stream)
          try {
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 4
            $machine = $reader.ReadUInt16()
          } finally {
            $reader.Dispose()
            $stream.Dispose()
          }
          $expectedMachine = if ('${{ matrix.arch }}' -eq 'arm64') { 0xaa64 } else { 0x8664 }
          if ($machine -ne $expectedMachine) {
            throw ('Pulpo.exe has PE machine 0x{0:x4}; expected 0x{1:x4} for ${{ matrix.arch }}.' -f $machine, $expectedMachine)
          }

          $makeDirectory = 'apps/desktop/out/make/squirrel.windows/${{ matrix.arch }}'
          $artifacts = @(Get-ChildItem -Path $makeDirectory -File)
          $packages = @(Get-ChildItem -Path $makeDirectory -File -Filter '*-full.nupkg')
          $manifests = @(Get-ChildItem -Path $makeDirectory -File -Filter 'RELEASES')
          if ($artifacts.Count -ne 3 -or $setupFiles[0].Name -ne 'Setup.exe' -or $packages.Count -ne 1 -or $manifests.Count -ne 1) {
            throw 'Forge did not produce exactly Setup.exe, one full NUPKG, and one RELEASES manifest.'
          }
          if ((Get-Content -Raw $manifests[0].FullName) -notmatch [regex]::Escape($packages[0].Name)) {
            throw "The RELEASES manifest does not reference $($packages[0].Name)."
          }

      - name: Stage architecture-specific Windows artifacts
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          node apps/desktop/scripts/stage-windows-artifacts.mjs `
            'apps/desktop/out/make/squirrel.windows/${{ matrix.arch }}' `
            'apps/desktop/out/release/windows/${{ matrix.arch }}' `
            '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to stage architecture-specific Windows artifacts.'
          }

      - name: Upload Windows desktop artifacts
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: |
            apps/desktop/out/release/windows/${{ matrix.arch }}/*Setup.exe
            apps/desktop/out/release/windows/${{ matrix.arch }}/*-full.nupkg
            apps/desktop/out/release/windows/${{ matrix.arch }}/RELEASES*
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    name: Publish desktop artifacts
    if: >-
      needs.release.outputs.version != ''
    needs: [release, desktop-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: desktop-artifacts
          merge-multiple: true

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find desktop-artifacts -type f \( \
            -name '*.zip' -o \
            -name '*.dmg' -o \
            -name '*Setup.exe' -o \
            -name '*-full.nupkg' -o \
            -name 'RELEASES*' \
          \) -print0)
          if (( ${#artifacts[@]} != 12 )); then
            echo "Expected two ZIPs, two DMGs, four Setup EXEs, two full NUPKGs, and two RELEASES manifests; found ${#artifacts[@]}." >&2
            exit 1
          fi
          zip_count="$(find desktop-artifacts -type f -name '*.zip' | wc -l | tr -d ' ')"
          dmg_count="$(find desktop-artifacts -type f -name '*.dmg' | wc -l | tr -d ' ')"
          setup_count="$(find desktop-artifacts -type f -name '*Setup.exe' | wc -l | tr -d ' ')"
          package_count="$(find desktop-artifacts -type f -name '*-full.nupkg' | wc -l | tr -d ' ')"
          manifest_count="$(find desktop-artifacts -type f -name 'RELEASES*' | wc -l | tr -d ' ')"
          if [[ "${zip_count}:${dmg_count}:${setup_count}:${package_count}:${manifest_count}" != '2:2:4:2:2' ]]; then
            echo "Unexpected release artifact mix (ZIP: ${zip_count}, DMG: ${dmg_count}, Setup: ${setup_count}, NUPKG: ${package_count}, RELEASES: ${manifest_count})." >&2
            exit 1
          fi
          for expected in \
            "Pulpo-darwin-arm64-${RELEASE_VERSION}.zip" \
            "Pulpo-darwin-x64-${RELEASE_VERSION}.zip" \
            "Pulpo-${RELEASE_VERSION}-macOS-arm64.dmg" \
            "Pulpo-${RELEASE_VERSION}-macOS-x64.dmg" \
            Setup.exe \
            Pulpo-win32-arm64-Setup.exe \
            "Pulpo-${RELEASE_VERSION}-Windows-x64-Setup.exe" \
            "Pulpo-${RELEASE_VERSION}-Windows-arm64-Setup.exe" \
            "Pulpo-${RELEASE_VERSION}-full.nupkg" \
            "Pulpo-win32-arm64-${RELEASE_VERSION}-full.nupkg" \
            RELEASES \
            RELEASES-win32-arm64; do
            match_count="$(find desktop-artifacts -type f -name "${expected}" | wc -l | tr -d ' ')"
            if [[ "${match_count}" != '1' ]]; then
              echo "Expected exactly one release artifact named ${expected}; found ${match_count}." >&2
              exit 1
            fi
          done
          gh release upload "v${RELEASE_VERSION}" "${artifacts[@]}" --clobber --repo "${GITHUB_REPOSITORY}"

  deploy-preview:
    name: Deploy Coolify preview
    # Never use the production application as a preview parent. Coolify preview
    # cleanup is application-scoped and can remove the parent's live containers.
    # Changes promoted from dev to main are already exercised by the persistent
    # development deployment.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [checks, cli-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_PULPO_DEV_APP_UUID }}
      PULL_REQUEST_ID: ${{ github.event.pull_request.number }}
      PULL_REQUEST_SHA: ${{ github.event.pull_request.head.sha }}
      PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PREVIEW_URL: ${{ format('https://pulpo-dev-pr-{0}.deathgrips.org', github.event.pull_request.number) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check preview topology compatibility
        id: topology
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${PULL_REQUEST_BASE_SHA}"
          if git diff --quiet "${PULL_REQUEST_BASE_SHA}" "${PULL_REQUEST_SHA}" -- compose.yaml; then
            echo 'supported=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'supported=false' >> "${GITHUB_OUTPUT}"
            echo '::notice::The complete bootstrap smoke test will be skipped because this PR changes compose.yaml; public edge health is still required.'
          fi

      - name: Set up Coolify CLI
        run: bash .github/scripts/setup-coolify.sh

      - name: Validate preview configuration
        run: bash .github/scripts/validate-coolify-preview-env.sh "${COOLIFY_APP_UUID}"

      - name: Find automatic preview deployment
        id: deploy
        run: bash .github/scripts/find-coolify-preview-deployment.sh

      - name: Wait for preview deployment
        run: bash .github/scripts/wait-coolify-deployment.sh "${{ steps.deploy.outputs.deployment_uuid }}"

      - name: Validate preview edge health
        run: bash .github/scripts/wait-http-health.sh "${PREVIEW_URL}/health" preview

      - name: Smoke-test preview bootstrap
        if: steps.topology.outputs.supported == 'true'
        env:
          PULPO_PREVIEW_SMOKE_EMAIL: ${{ secrets.PULPO_PREVIEW_SMOKE_EMAIL }}
          PULPO_PREVIEW_SMOKE_PASSWORD: ${{ secrets.PULPO_PREVIEW_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          setup_status="$(curl --fail --silent --show-error --max-time 10 "${PREVIEW_URL}/api/auth/setup-status")"
          jq -e '.required == false' <<< "${setup_status}" >/dev/null || {
            echo "Preview bootstrap did not create the initial administrator." >&2
            exit 1
          }
          bash .github/scripts/smoke-preview-runtime.sh

      - name: Explain topology-incompatible preview
        if: steps.topology.outputs.supported == 'false'
        run: |
          set -euo pipefail
          {
            echo '### Coolify preview edge verified'
            echo
            echo 'The public health endpoint passed. This pull request changes `compose.yaml`, so Coolify built the images using the base application topology and the complete bootstrap smoke test was not run.'
            echo
            echo 'The Compose configuration remains validated by the build checks.'
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup-preview:
    name: Delete Coolify preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_PULPO_DEV_APP_UUID }}
      PULL_REQUEST_ID: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Coolify CLI
        run: bash .github/scripts/setup-coolify.sh

      - name: Delete preview
        run: |
          set -euo pipefail
          : "${COOLIFY_APP_UUID:?selected Coolify application UUID is required}"
          : "${PULL_REQUEST_ID:?pull request id is required}"
          if output="$(coolify app previews delete "${COOLIFY_APP_UUID}" "${PULL_REQUEST_ID}" --force --format json 2>&1)"; then
            echo "Deleted Coolify preview for PR ${PULL_REQUEST_ID}."
          elif grep -Eqi 'not found|404|does not exist' <<< "${output}"; then
            echo "Coolify preview for PR ${PULL_REQUEST_ID} was already absent."
          else
            printf '%s\n' "${output}" >&2
            exit 1
          fi

  deploy-development:
    name: Deploy Coolify development
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    needs: [checks, cli-package]
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_PULPO_DEV_APP_UUID }}
      DEVELOPMENT_URL: ${{ vars.PULPO_DEVELOPMENT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Coolify CLI
        run: bash .github/scripts/setup-coolify.sh

      - name: Deploy validated development commit
        id: deploy
        run: bash .github/scripts/deploy-coolify-commit.sh "${GITHUB_SHA}"

      - name: Wait for healthy development deployment
        run: bash .github/scripts/wait-coolify-deployment.sh "${{ steps.deploy.outputs.deployment_uuid }}"

      - name: Validate development edge health
        run: bash .github/scripts/wait-http-health.sh "${DEVELOPMENT_URL%/}/health" development 90 2

  deploy-production:
    name: Deploy Coolify production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release.outputs.version != ''
    needs: release
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_PULPO_APP_UUID }}
      COOLIFY_WORKER_APP_UUID: ${{ vars.COOLIFY_PULPO_WORKER_APP_UUID }}
      COOLIFY_WEB_APP_UUID: ${{ vars.COOLIFY_PULPO_WEB_APP_UUID }}
      PRODUCTION_URL: ${{ vars.PULPO_PRODUCTION_URL || 'https://pulpo.baby' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Set up Coolify CLI
        run: bash .github/scripts/setup-coolify.sh

      - name: Migrate and roll out API, worker, and web
        env:
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: bash .github/scripts/deploy-production.sh "${RELEASE_COMMIT}"

      - name: Validate production edge health
        run: bash .github/scripts/wait-http-health.sh "${PRODUCTION_URL%/}/health" production 90 2

  google-play:
    name: Release Android to GitHub and Google Play
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release.outputs.version != ''
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ needs.release.outputs.version }}
      upload: true
      publish_github: true
      release_status: ${{ vars.ANDROID_RELEASE_STATUS || 'completed' }}
    secrets: inherit

  testflight:
    name: Build and submit iOS to TestFlight
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release.outputs.version != ''
    needs: release
    runs-on: macos-26
    environment: testflight
    permissions:
      contents: read
    concurrency:
      group: testflight-main
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.release.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm clean-install
        working-directory: .

      - name: Build mobile workspace dependencies
        run: |
          npm run build -w @pulpo/contracts
          npm run build -w @pulpo/client-core
        working-directory: .

      - name: Set iOS version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          build_number="$(date -u +%s)"

          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Semantic-release produced an invalid version: ${RELEASE_VERSION}" >&2
            exit 1
          fi

          {
            echo "PULPO_APP_VERSION=${RELEASE_VERSION}"
            echo "PULPO_IOS_BUILD_NUMBER=${build_number}"
          } >> "${GITHUB_ENV}"

          echo "Preparing ${RELEASE_VERSION} (${build_number}) for TestFlight."

      - name: Generate the native iOS project
        env:
          CI: 1
        run: npx expo prebuild --platform ios --clean

      # Keep Apple credentials out of dependency and Expo lifecycle scripts.
      # Xcode receives them only while archiving and uploading the app.
      - name: Archive and upload to TestFlight
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          IOS_DEVELOPMENT_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
          IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY \
            IOS_DEVELOPMENT_CERTIFICATE_P12_BASE64 \
            IOS_DEVELOPMENT_CERTIFICATE_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "The ${variable} GitHub environment secret is not configured." >&2
              exit 1
            fi
          done

          auth_key_path="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          certificate_path="${RUNNER_TEMP}/Pulpo-CI.p12"
          keychain_path="${RUNNER_TEMP}/pulpo-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          trap 'security delete-keychain "${keychain_path}" 2>/dev/null || true; rm -f "${auth_key_path}" "${certificate_path}"' EXIT

          printf '%s' "${APP_STORE_CONNECT_API_PRIVATE_KEY}" > "${auth_key_path}"
          printf '%s' "${IOS_DEVELOPMENT_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}"
          chmod 600 "${auth_key_path}"
          chmod 600 "${certificate_path}"

          echo 'Creating temporary signing keychain.'
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"

          echo 'Importing Apple Development signing identity.'
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${IOS_DEVELOPMENT_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12

          if ! security find-identity -v -p codesigning "${keychain_path}" | grep -q 'Apple Development'; then
            echo 'The imported PKCS#12 does not contain a valid Apple Development signing identity and private key.' >&2
            exit 1
          fi

          echo 'Configuring signing identity key access.'
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

          archive_path="${RUNNER_TEMP}/Pulpo.xcarchive"
          export_options_path="${RUNNER_TEMP}/ExportOptions.plist"

          echo "Uploading ${PULPO_APP_VERSION} (${PULPO_IOS_BUILD_NUMBER}) to TestFlight."

          xcodebuild \
            -workspace ios/Pulpo.xcworkspace \
            -scheme Pulpo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${archive_path}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${auth_key_path}" \
            -authenticationKeyID "${APP_STORE_CONNECT_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_API_ISSUER_ID}" \
            DEVELOPMENT_TEAM=PX72AL9366 \
            MARKETING_VERSION="${PULPO_APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${PULPO_IOS_BUILD_NUMBER}" \
            archive

          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "${export_options_path}"
          /usr/libexec/PlistBuddy -c 'Add :destination string upload' "${export_options_path}"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "${export_options_path}"
          /usr/libexec/PlistBuddy -c 'Add :teamID string PX72AL9366' "${export_options_path}"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "${export_options_path}"
          /usr/libexec/PlistBuddy -c 'Add :testFlightInternalTestingOnly bool false' "${export_options_path}"

          xcodebuild \
            -exportArchive \
            -archivePath "${archive_path}" \
            -exportOptionsPlist "${export_options_path}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${auth_key_path}" \
            -authenticationKeyID "${APP_STORE_CONNECT_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_API_ISSUER_ID}"
