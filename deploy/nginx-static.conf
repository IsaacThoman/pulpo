# Production API paths are routed directly to the API by Traefik. This
# frontend has no fixed API container address to go stale during replacement.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /ready {
    access_log off;
    root /tmp;
    try_files /pulpo-web-ready =503;
  }

  # If no API backend is ready, never turn an API error into an HTML 200.
  location ~ ^/(api(/|$)|v1(/|$)|socket\.io(/|$)|health$) {
    return 503;
  }

  location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
  }

  # Code previews run in /sandbox.html inside an iframe without allow-same-origin. The CSP sandbox
  # directive keeps its origin opaque even if it is opened directly. Keep in sync with
  # apps/web/sandbox.html and apps/desktop/src/security.ts. `no-transform` stops Cloudflare from
  # injecting its bot-detection script, which throws a SecurityError in the opaque-origin frame.
  location = /sandbox.html {
    add_header Content-Security-Policy "sandbox allow-scripts allow-modals allow-popups allow-forms allow-downloads; default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src data: https:; media-src data: blob: https:; connect-src 'self' https:; worker-src blob:; frame-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache, no-transform" always;
    try_files $uri =404;
  }

  # The sandbox's opaque origin fetches its module chunks in CORS mode. Asset names carry a
  # content hash, so browsers can keep them indefinitely. No `always`: a 404 must not be cached.
  location /assets/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell names the current build's hashed assets. Revalidate it on every load so a tab
  # reloading after a deploy (see apps/web/src/lib/stale-build.ts) never gets the old asset list.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
  location = /landing.html {
    add_header Cache-Control "no-cache" always;
  }

  # The signed-out landing page, pre-rendered at build time for crawlers and link previews.
  location = / {
    add_header Cache-Control "no-cache" always;
    try_files /landing.html /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
