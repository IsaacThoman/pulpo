map $http_x_forwarded_proto $pulpo_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 25m;
  root /usr/share/nginx/html;

  location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
  }
  location = /.well-known/assetlinks.json {
    proxy_pass http://${API_HOST}:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
  }
  index index.html;

  location = /health {
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  location = /api/chats/import {
    client_max_body_size 100m;
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Full-instance archives can be much larger than regular attachments. Match
  # the authenticated restore endpoint's 20 GiB multipart limit without
  # increasing the request limit for the rest of the public application.
  location = /api/admin/restore {
    client_max_body_size 20g;
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location ~ ^/(api|v1)/ {
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /socket.io/ {
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Code previews run in /sandbox.html inside an iframe without allow-same-origin. The CSP sandbox
  # directive keeps its origin opaque even if it is opened directly. Keep in sync with
  # apps/web/sandbox.html and apps/desktop/src/security.ts.
  location = /sandbox.html {
    add_header Content-Security-Policy "sandbox allow-scripts allow-modals allow-popups allow-forms allow-downloads; default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src data: https:; media-src data: blob: https:; connect-src 'self' https:; worker-src blob:; frame-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # The sandbox's opaque origin fetches its module chunks in CORS mode.
  location /assets/ {
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
