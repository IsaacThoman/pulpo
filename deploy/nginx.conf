map $http_x_forwarded_proto $pulpo_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 25m;
  root /usr/share/nginx/html;

  location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
  }
  location = /.well-known/assetlinks.json {
    proxy_pass http://${API_HOST}:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
  }
  index index.html;

  location = /health {
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  location = /api/chats/import {
    client_max_body_size 100m;
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Full-instance archives can be much larger than regular attachments. Match
  # the authenticated restore endpoint's 20 GiB multipart limit without
  # increasing the request limit for the rest of the public application.
  location = /api/admin/restore {
    client_max_body_size 20g;
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Agent clients resend long histories with images and tool output. Allow a
  # little over the API's 32 MiB generation limit so the API rejects requests
  # just past it with the appropriate JSON error envelope.
  location ^~ /v1/ {
    client_max_body_size 33m;
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location ~ ^/(api|v1)/ {
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /socket.io/ {
    proxy_pass http://${API_HOST}:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $pulpo_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Code previews run in /sandbox.html inside an iframe without allow-same-origin. The CSP sandbox
  # directive keeps its origin opaque even if it is opened directly. Keep in sync with
  # apps/web/sandbox.html and apps/desktop/src/security.ts. `no-transform` stops Cloudflare from
  # injecting its bot-detection script, which throws a SecurityError in the opaque-origin frame.
  location = /sandbox.html {
    add_header Content-Security-Policy "sandbox allow-scripts allow-modals allow-popups allow-forms allow-downloads; default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src data: https:; media-src data: blob: https:; connect-src 'self' https:; worker-src blob:; frame-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache, no-transform" always;
    try_files $uri =404;
  }

  # The sandbox's opaque origin fetches its module chunks in CORS mode. Asset names carry a
  # content hash, so browsers can keep them indefinitely. No `always`: a 404 must not be cached.
  location /assets/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell names the current build's hashed assets. Revalidate it on every load so a tab
  # reloading after a deploy (see apps/web/src/lib/stale-build.ts) never gets the old asset list.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
  location = /landing.html {
    add_header Cache-Control "no-cache" always;
  }

  # The signed-out landing page, pre-rendered at build time for crawlers and link previews.
  location = / {
    add_header Cache-Control "no-cache" always;
    try_files /landing.html /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
